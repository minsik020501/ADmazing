# NVIDIA GPU 서버에서 api 컨테이너가 GPU를 쓰도록 하는 설정
# 호스트에 NVIDIA 드라이버와 NVIDIA Container Toolkit이 설치되어 있어야 한다
#
# 사용:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
services:
  api:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
