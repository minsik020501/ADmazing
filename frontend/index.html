<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admazing</title>
    <!-- 저장된 테마를 화면을 그리기 전에 적용해 새로고침 시 다른 테마가 잠깐 보이지 않게 함.
         키 이름은 src/components/layout/ThemeToggle.tsx의 STORAGE_KEY와 같아야 함 -->
    <script>
      try {
        var savedTheme = localStorage.getItem("admazing-theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch (e) {}
    </script>
    <!-- UI 글꼴 Mona12 (OFL 1.1). 버전을 고정해 폰트 업데이트로 화면이 바뀌지 않게 함 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/MonadABXY/mona-font@2026.10.09/web/mona.css"
    />
    <!-- 에디터에서 이미지에 넣는 글꼴 (Mona12 + 아래 6종) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;700&family=Black+Han+Sans&family=Nanum+Pen+Script&family=Do+Hyeon&family=Jua&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
