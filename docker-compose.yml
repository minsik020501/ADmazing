x-api-build: &api-build
  context: ./backend/fastapi
  args:
    INSTALL_ML: ${INSTALL_ML:-false}

x-api-environment: &api-environment
  # .env의 SDXL, Z-Image 경로는 레포 루트 기준(실험 스크립트용)이라 컨테이너 경로로 덮어쓴다
  SDXL_MODEL_DIR: /models/sdxl-base
  SDXL_VAE_DIR: /models/sdxl-vae-fp16-fix
  ZIMAGE_MODEL_DIR: /models/z-image-turbo

services:
  # api보다 먼저 한 번 실행된다. ZIMAGE_QUANT 양자화 모델이 없으면 원본에서 변환해 저장하고,
  # 이미 있거나 양자화를 쓰지 않으면 바로 끝난다 (app/cli/prepare_zimage.py)
  model-prep:
    build: *api-build
    image: admazing-api
    env_file: .env
    environment: *api-environment
    command: ["python", "-m", "app.cli.prepare_zimage"]
    volumes:
      - ./backend/fastapi/app:/app/app
      # 변환 결과를 써야 하므로 api와 달리 쓰기 가능으로 마운트한다
      - ./models:/models

  api:
    build: *api-build
    image: admazing-api
    env_file: .env
    environment: *api-environment
    ports:
      - "11000:11000"
    volumes:
      - ./backend/fastapi/app:/app/app
      - ./models:/models:ro
      # GENERATION_LOG_PATH 측정 로그
      - ./logs:/app/logs
      - hf-cache:/root/.cache/huggingface
    depends_on:
      model-prep:
        condition: service_completed_successfully

  # frontend보다 먼저 한 번 실행된다. fonts/manifest.json의 광고용 폰트를 받아 woff2로
  # 준비하고, 이미 준비된 파일은 건너뛴다 (scripts/prepare_fonts.py).
  # 폰트 파일은 git에 올리지 않고 font-files 볼륨에 두며, 받기에 실패해도 frontend는 뜬다
  font-prep:
    build: ./scripts
    command: ["python", "scripts/prepare_fonts.py", "--no-generate", "--keep-going"]
    environment:
      FONT_SOURCE_DIR: /cache
      FONT_OUTPUT_DIR: /out
    volumes:
      - ./scripts:/app/scripts:ro
      # manifest와 직접 받아 둔 폰트(fonts/manual/)
      - ./fonts:/app/fonts:ro
      - font-cache:/cache
      - font-files:/out

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://api:11000
    ports:
      - "12000:12000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # font-prep이 준비한 폰트를 /fonts/... 경로로 제공한다
      - font-files:/app/public/fonts:ro
    depends_on:
      api:
        condition: service_started
      font-prep:
        condition: service_completed_successfully

  # 학습용 — 필요할 때만 실행: docker compose --profile train run --rm trainer
  trainer:
    profiles: ["train"]
    build: ./backend/ai
    env_file: .env
    volumes:
      - ./backend/ai:/app
      - ./models:/models
      - hf-cache:/root/.cache/huggingface

volumes:
  hf-cache:
  # 폰트 원본 캐시와 변환 결과 (docker compose down -v로 지우면 다음 실행 때 다시 받는다)
  font-cache:
  font-files:
